[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "stonetree-it-automation-demo"
version = "0.1.0"
description = "A dependency-free onboarding/offboarding automation demo for Bitrix24"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Alexander Beloshapka" }]
dependencies = []

[project.scripts]
stonetree-it = "stonetree_it_automation.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

